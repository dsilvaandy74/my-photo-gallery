<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anand's Memories</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .tab-button {
      padding: 10px 28px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 9999px;
      transition: all 0.2s ease;
    }
    .tab-button.active {
      background-color: #0f172a;
      color: white;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
    }
    .tab-button:not(.active) {
      background-color: #f1f5f9;
      color: #475569;
    }
    .tab-button:not(.active):hover {
      background-color: #e2e8f0;
    }
    
    .media-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto px-6 py-8">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-semibold tracking-tight">Anand's Memories</h1>
      <p class="text-slate-500 mt-2">A collection of moments</p>
    </div>

    <!-- Tabs -->
    <div class="flex justify-center mb-8">
      <div class="inline-flex bg-slate-100 rounded-full p-1">
        <button onclick="showPhotos()" id="tab-photos"
                class="tab-button active px-6 py-2 text-sm font-medium rounded-full">
          Photos
        </button>
        <button onclick="showVideos()" id="tab-videos"
                class="tab-button px-6 py-2 text-sm font-medium rounded-full">
          Videos
        </button>
      </div>
    </div>

    <!-- Photos -->
    <div id="photos-section">
      <div id="photo-grid" 
           class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      </div>
    </div>

    <!-- Videos -->
    <div id="videos-section" class="hidden">
      <div id="video-grid" 
           class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
      </div>
    </div>

  </div>

  <!-- Photo Lightbox -->
  <div id="photo-modal" onclick="closePhotoModal()" 
       class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
    <div onclick="event.stopImmediatePropagation()" class="max-w-4xl w-full">
      <img id="modal-image" class="max-h-[80vh] w-full object-contain rounded-xl" alt="">
      <div class="text-center mt-4">
        <p id="modal-caption" class="text-white text-lg"></p>
      </div>
    </div>
  </div>

  <!-- Video Modal -->
  <div id="video-modal" onclick="closeVideoModal()" 
       class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
    <div onclick="event.stopImmediatePropagation()" class="w-full max-w-3xl">
      <div class="bg-black rounded-2xl overflow-hidden">
        <div id="video-container" class="aspect-video bg-black"></div>
      </div>
      <div class="text-center mt-3">
        <p id="video-title" class="text-white text-lg font-medium"></p>
      </div>
    </div>
  </div>

  <script>
    // ==================== DATA ====================
    const PHOTOS = [
      { file: "./images/file (1).jpg", caption: "Photo 1" },
      { file: "./images/file (2).jpg", caption: "Photo 2" },
      { file: "./images/file (3).jpg", caption: "Photo 3" },
      { file: "./images/file (4).jpg", caption: "Photo 4" },
      { file: "./images/file (5).jpg", caption: "Photo 5" },
      { file: "./images/file (6).jpg", caption: "Photo 6" },
      { file: "./images/file (7).jpg", caption: "Photo 7" },
      { file: "./images/file (8).jpg", caption: "Photo 8" },
      { file: "./images/file (1).png", caption: "Photo 9" },
      { file: "./images/file (2).png", caption: "Photo 10" },
      { file: "./images/file (3).png", caption: "Photo 11" },
      { file: "./images/file (4).png", caption: "Photo 12" },
      { file: "./images/file (5).png", caption: "Photo 13" },
      { file: "./images/file (6).png", caption: "Photo 14" },
      { file: "./images/file (7).png", caption: "Photo 15" },
      { file: "./images/file (8).png", caption: "Photo 16" },
      { file: "./images/file (9).png", caption: "Photo 17" },
      { file: "./images/file (10).png", caption: "Photo 18" },
      { file: "./images/file (11).png", caption: "Photo 19" },
      { file: "./images/file (12).png", caption: "Photo 20" },
      { file: "./images/file (13).png", caption: "Photo 21" },
      { file: "./images/file (14).png", caption: "Photo 22" },
      { file: "./images/file (15).png", caption: "Photo 23" },
      { file: "./images/file (16).png", caption: "Photo 24" },
      { file: "./images/file (17).png", caption: "Photo 25" },
      { file: "./images/file (18).png", caption: "Photo 26" },
      { file: "./images/file (19).png", caption: "Photo 27" },
      { file: "./images/file (20).png", caption: "Photo 28" },
      { file: "./images/file (21).png", caption: "Photo 29" }
    ];

    const VIDEOS = [
      { id: "mbPIEF7kPm4", title: "Video 1" },
      { id: "c9Bx7gJf6Rg", title: "Video 2" }
    ];

    // ==================== RENDER FUNCTIONS ====================
    function renderPhotos() {
      const grid = document.getElementById("photo-grid");
      grid.innerHTML = "";

      PHOTOS.forEach((photo, index) => {
        const card = document.createElement("div");
        card.className = `media-card aspect-[4/3] rounded-2xl overflow-hidden shadow-sm border border-slate-200 cursor-pointer`;
        card.innerHTML = `
          <img src="${photo.file}" alt="${photo.caption}" class="w-full h-full object-cover">
        `;
        card.onclick = () => openPhotoModal(index);
        grid.appendChild(card);
      });
    }

    function renderVideos() {
      const grid = document.getElementById("video-grid");
      grid.innerHTML = "";

      VIDEOS.forEach((video, index) => {
        const card = document.createElement("div");
        card.className = `media-card aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-sm cursor-pointer flex items-center justify-center`;
        card.innerHTML = `
          <div class="text-center text-white">
            <i class="fab fa-youtube text-red-500 text-4xl mb-2"></i>
            <p class="text-sm font-medium">${video.title}</p>
          </div>
        `;
        card.onclick = () => openVideoModal(index);
        grid.appendChild(card);
      });
    }

    // ==================== MODALS ====================
    function openPhotoModal(index) {
      const modal = document.getElementById("photo-modal");
      const img = document.getElementById("modal-image");
      const caption = document.getElementById("modal-caption");

      img.src = PHOTOS[index].file;
      caption.textContent = PHOTOS[index].caption;

      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closePhotoLightbox() {
      const modal = document.getElementById("photo-modal");
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    function openVideoModal(index) {
      const modal = document.getElementById("video-modal");
      const container = document.getElementById("video-container");
      const title = document.getElementById("video-title");

      const video = VIDEOS[index];
      title.textContent = video.title;
      container.innerHTML = "";

      const iframe = document.createElement("iframe");
      iframe.width = "100%";
      iframe.height = "100%";
      iframe.src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
      iframe.title = video.title;
      iframe.frameBorder = "0";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      container.appendChild(iframe);

      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeVideoModal() {
      const modal = document.getElementById("video-modal");
      const container = document.getElementById("video-container");
      container.innerHTML = "";
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    // ==================== TAB FUNCTIONS ====================
    function showPhotos() {
      document.getElementById('photos-section').style.display = 'block';
      document.getElementById('videos-section').style.display = 'none';

      document.getElementById('tab-photos').classList.add('active');
      document.getElementById('tab-videos').classList.remove('active');
    }

    function showVideos() {
      document.getElementById('photos-section').style.display = 'none';
      document.getElementById('videos-section').style.display = 'block';

      document.getElementById('tab-photos').classList.remove('active');
      document.getElementById('tab-videos').classList.add('active');
    }

    // ==================== INITIALIZATION ====================
    function initializeGallery() {
      renderPhotos();
      renderVideos();
      showPhotos(); // default to photos
    }

    // Keyboard support
    document.addEventListener("keydown", function(e) {
      const photoModal = document.getElementById("photo-modal");
      const videoModal = document.getElementById("video-modal");

      if (!photoModal.classList.contains("hidden") && e.key === "Escape") {
        closePhotoLightbox();
      }
      if (!videoModal.classList.contains("hidden") && e.key === "Escape") {
        closeVideoModal();
      }
    });

    // Start the app
    window.onload = function() {
      initializeGallery();
    };
  </script>
</body>
</html>
